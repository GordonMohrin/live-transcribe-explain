<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Live Transcribe &amp; Explain</title>
<style>
  :root { color-scheme: light dark; }
  body { width: 300px; margin: 0; padding: 12px 14px; font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  label { display: block; margin: 4px 0; }
  fieldset { border: 1px solid #8884; border-radius: 6px; margin: 8px 0; padding: 4px 8px 6px; }
  legend { font-size: 12px; opacity: .8; }
  .switch { margin: 4px 0 8px; }
  .switch label { font-size: 12px; opacity: .8; margin: 0 0 2px; }
  .switch select { width: 100%; font: inherit; padding: 3px 4px; }
  .switch .hint { font-size: 11.5px; opacity: .7; margin-top: 2px; }
  button { width: 100%; padding: 8px; margin-top: 8px; font: inherit; font-weight: 600; border-radius: 6px; border: 0; cursor: pointer;
    background: #1f6feb; color: #fff; }
  button.stop { background: #d1242f; }
  .legal { font-size: 11.5px; background: #fff8c5; color: #4d3800; border-radius: 6px; padding: 6px 8px; margin: 8px 0; }
  .status { font-size: 12px; opacity: .85; margin-top: 8px; white-space: pre-wrap; }
  a { font-size: 12px; }
</style>
<h1 data-i18n="title"></h1>
<fieldset>
  <legend data-i18n="source"></legend>
  <div id="switches"></div>
  <label><input type="checkbox" id="mic"> <span data-i18n="alsoMic"></span></label>
</fieldset>
<div class="legal" data-i18n="legalShort"></div>
<button id="toggle"></button>
<div class="status" id="status"></div>
<p><a href="options.html" target="_blank" data-i18n="settingsLink"></a></p>
<script type="module" src="popup.js"></script>
</html>
